<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
	<link rel="stylesheet" href="style.css">

	<title>Frontend Mentor | Product preview card component</title>
</head>
<body>
<main>
	<article class="card">
		<picture>
			<source media="(min-width: 768px)" srcset="images/image-product-desktop.jpg">
			<img src="images/image-product-mobile.jpg" alt="Perfume" width="350" height="342">
		</picture>
		<div class="text-container">
			<p class="text-preset-4">PERFUME</p>
			<h1 class="text-preset-1">Gabrielle Essence Eau De Parfum</h1>
			<p class="text-preset-3">
				A floral, solar and voluptuous interpretation composed by Olivier Polge,
				Perfumer-Creator for the House of CHANEL.
			</p>
			<div class="price-container">
				<span class="price-current text-preset-1">$149.99</span>
				<span class="price-original text-preset-5">$169.99</span>
			</div>
			<button><i class="icon-cart" aria-hidden="true"></i><span class="text-preset-2">Add to Cart</span></button>
		</div>
	</article>
</main>
<footer class="attribution">
	Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
	Coded by <a href="https://ryanwells.io">Ryan Wells</a>.
</footer>
</body>
</html>
